<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a new job</title>
    <style>
        /* ألوان البالتة */
        :root {
            --primary: #1a237e;      /* أزرق داكن */
            --secondary: #3949ab;    /* أزرق فاتح */
            --accent: #00c853;       /* أخضر */
            --light: #ffffff;        /* خلفية بيضاء */
            --dark: #ffffff;         /* لون النص */
            --border: #e0e0e0;       /* حدود */
            --gradient: linear-gradient(135deg, #1a237e, #3949ab);
        }

        /* الخلفية المتحركة */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #1a237e, #3949ab, #00c853, #1a237e);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        .animated-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 50%;
            right: -100px;
            animation-delay: -5s;
        }

        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: -75px;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(100px, 100px) rotate(120deg);
            }
            66% {
                transform: translate(-50px, 200px) rotate(240deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            backdrop-filter: blur(10px);
            animation: container-appear 0.8s ease-out;
        }

        @keyframes container-appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 6px;
            background: var(--gradient);
            border-radius: 20px 20px 0 0;
            animation: border-glow 2s ease-in-out infinite;
        }

        @keyframes border-glow {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        h1 {
            color: var(--primary);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--border);
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: title-appear 1s ease-out;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
            animation: form-group-appear 0.5s ease-out forwards;
            opacity: 0;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        @keyframes form-group-appear {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
        .form-group:nth-child(7) { animation-delay: 0.7s; }
        .form-group:nth-child(8) { animation-delay: 0.8s; }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            background-color: white;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(57, 73, 171, 0.15);
            transform: translateY(-2px);
        }

        textarea {
            height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .btn-submit {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            display: block;
            margin: 30px auto 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(26, 35, 126, 0.3);
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .file-upload-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed var(--border);
            border-radius: 12px;
            background-color: #f8f9fa;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            flex-direction: column;
            height: 150px;
        }

        .file-upload-content:hover {
            border-color: var(--secondary);
            background-color: #f0f4ff;
        }

        .upload-icon {
            margin-bottom: 15px;
            color: var(--primary);
        }

        .file-upload-text {
            color: var(--primary);
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .selected-file-name {
            color: var(--secondary);
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
            max-width: 100%;
        }

        .file-preview {
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .file-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                margin: 20px;
                padding: 25px;
            }
            
            .btn-submit {
                max-width: 100%;
            }
            
            h1 {
                font-size: 24px;
            }
        }

        /* تأثيرات إضافية */
        .form-group:hover label {
            color: var(--secondary);
        }

        .success-message {
            background: linear-gradient(135deg, #00c853, #69f0ae);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 18px;
            text-align: center;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dynamic-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
            align-items: center;
        }

        .dynamic-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .dynamic-input-group input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.15);
        }

        .remove-btn {
            background: var(--secondary);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .add-btn:hover {
            background: #00b248;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.2);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="protected-page">
    <div class="animated-background"></div>
    <div class="animated-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="container">
        <h1>Add a new job</h1>
        
        <form id="addJobForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" name="company" required>
                </div>
                
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" required>
                </div>
                
                <div class="form-group">
                    <label for="jobType">Job Type</label>
                    <select id="jobType" name="jobType" required>
                        <option value="">Select Job Type</option>
                        <option value="full-time">Full Time</option>
                        <option value="part-time">Part Time</option>
                        <option value="contract">Contract</option>
                        <option value="freelance">Freelance</option>
                        <option value="internship">Internship</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="salary">Salary (optional)</label>
                    <input type="number" id="salary" name="salary">
                </div>
                
                <div class="form-group full-width">
                    <label for="description">Job Description</label>
                    <textarea id="description" name="description" required></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label>Responsibilities</label>
                    <div id="responsibilities-container">
                        <div class="dynamic-input-group">
                            <input type="text" name="responsibilities[]" required placeholder="Enter responsibility">
                            <button type="button" class="remove-btn" onclick="removeField(this)">×</button>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addField('responsibilities-container', 'responsibilities[]')">+ Add Responsibility</button>
                </div>

                <div class="form-group full-width">
                    <label>Skills</label>
                    <div id="skills-container">
                        <div class="dynamic-input-group">
                            <input type="text" name="skills[]" required placeholder="Enter skill">
                            <button type="button" class="remove-btn" onclick="removeField(this)">×</button>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addField('skills-container', 'skills[]')">+ Add Skill</button>
                </div>
                
                <div class="form-group full-width">
                    <label for="jobImage">Job Image (JPG only)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="jobImage" name="jobImage" accept=".jpg,image/jpeg" class="file-upload-input">
                        <div class="file-upload-content">
                            <div class="upload-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 3V15M12 3L8 7M12 3L16 7M22 15V19C22 19.5304 21.7893 20.0391 21.4142 20.4142C21.0391 20.7893 20.5304 21 20 21H4C3.46957 21 2.96086 20.7893 2.58579 20.4142C2.21071 20.0391 2 19.5304 2 19V15" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <span class="file-upload-text">Choose a file or drag it here</span>
                            <span class="selected-file-name"></span>
                        </div>
                    </div>
                    <div class="file-preview" id="imagePreview"></div>
                </div>
                
                <div class="form-group">
                    <label for="applicationDeadline">Application Deadline</label>
                    <input type="date" id="applicationDeadline" name="applicationDeadline" required>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Publish Job</button>
        </form>
        
        <div id="successMessage" class="success-message" style="display: none;">
            Deadline for Applications!
        </div>
    </div>
    <script>
        document.getElementById('jobImage').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || '';
            const filePreview = document.getElementById('imagePreview');
            const selectedFileName = document.querySelector('.selected-file-name');
            
            if (fileName) {
                selectedFileName.textContent = fileName;
                
                // معاينة الصورة
                filePreview.innerHTML = '';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(e.target.files[0]);
                filePreview.appendChild(img);
                filePreview.style.display = 'block';
            } else {
                selectedFileName.textContent = '';
                filePreview.style.display = 'none';
            }
        });

        function addField(containerId, inputName) {
            const container = document.getElementById(containerId);
            const inputGroups = container.getElementsByClassName('dynamic-input-group');
            
            if (inputGroups.length < 5) {
                const newGroup = document.createElement('div');
                newGroup.className = 'dynamic-input-group';
                newGroup.innerHTML = `
                    <input type="text" name="${inputName}" required placeholder="Enter ${containerId.includes('responsibilities') ? 'responsibility' : 'skill'}">
                    <button type="button" class="remove-btn" onclick="removeField(this)">×</button>
                `;
                container.appendChild(newGroup);
            } else {
                alert('Maximum 5 items allowed');
            }
        }

        function removeField(button) {
            const container = button.parentElement.parentElement;
            const inputGroups = container.getElementsByClassName('dynamic-input-group');
            
            if (inputGroups.length > 1) {
                button.parentElement.remove();
            } else {
                alert('At least one item is required');
            }
        }
    </script>
</body>
</html>
