<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration</title>
    <style>
    /* Reset & Base Styles */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
        --primary: #2c3e50;
        --secondary: #3498db;
        --accent: #e74c3c;
        --gradient: linear-gradient(135deg, #2c3e50, #3498db);
        --glass: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.2);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    body {
        background: linear-gradient(-45deg, #2c3e50, #3498db, #2980b9, #1abc9c);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        color: #333;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        width: 100%;
        max-width: 900px;
        animation: containerAppear 1s ease-out;
        border: 1px solid var(--glass-border);
    }

    @keyframes containerAppear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Tabs */
    .tabs {
        display: flex;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border-bottom: 1px solid var(--glass-border);
    }

    .tab {
        flex: 1;
        text-align: center;
        padding: 20px 0;
        cursor: pointer;
        position: relative;
        transition: all 0.4s ease;
        font-weight: 600;
        color: var(--primary);
        font-size: 1.1em;
        letter-spacing: 1px;
    }

    .tab:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    .tab.active {
        background: var(--gradient);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Form Sections */
    .form-section {
        padding: 40px;
        display: none;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-section.active {
        display: block;
        opacity: 1;
        transform: translateY(0);
    }

    h1 {
        color: var(--primary);
        text-align: center;
        margin-bottom: 35px;
        font-size: 32px;
        letter-spacing: 2px;
        position: relative;
        padding-bottom: 15px;
    }

    h1::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 3px;
        background: var(--gradient);
        border-radius: 3px;
    }

    h2 {
        color: var(--secondary);
        margin: 30px 0 20px;
        font-size: 20px;
        position: relative;
        padding-left: 15px;
    }

    h2::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 20px;
        background: var(--gradient);
        border-radius: 2px;
    }

    /* Form Elements */
    .form-group {
        margin-bottom: 25px;
        position: relative;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: var(--primary);
        font-size: 14px;
        transition: all 0.3s ease;
    }

    input, select, textarea {
        width: 100%;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        transition: all 0.3s ease;
        font-size: 15px;
        background: rgba(255, 255, 255, 0.9);
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        transform: translateY(-2px);
    }

    .required:after {
        content: " *";
        color: var(--accent);
    }

    /* Buttons */
    button {
        background: var(--gradient);
        color: white;
        padding: 16px 32px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.4s ease;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
    }

    button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent,
            rgba(255, 255, 255, 0.3),
            transparent
        );
        transition: 0.5s;
    }

    button:hover::before {
        left: 100%;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    button:active {
        transform: scale(0.98);
    }

    /* File Input */
    input[type="file"] {
        padding: 12px;
        background: white;
        border: 2px dashed var(--secondary);
        cursor: pointer;
    }

    input[type="file"]:hover {
        border-color: var(--primary);
    }

    /* Links */
    a {
        color: var(--secondary);
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
    }

    a::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--gradient);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s ease;
    }

    a:hover::after {
        transform: scaleX(1);
        transform-origin: left;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .container {
            margin: 20px;
            padding: 20px;
        }

        .tabs {
            flex-direction: column;
        }

        .tab {
            padding: 15px 0;
        }

        h1 {
            font-size: 24px;
        }

        .form-section {
            padding: 20px;
        }
    }

    /* Floating Labels */
    .form-group {
        position: relative;
    }

    .form-group label {
        position: absolute;
        top: -10px;
        left: 15px;
        background: white;
        padding: 0 5px;
        font-size: 12px;
        color: var(--secondary);
    }

    /* Custom Select */
    select {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 15px center;
        background-size: 15px;
        padding-right: 40px;
    }

    /* Animations */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-group {
        animation: fadeInUp 0.5s ease-out forwards;
        opacity: 0;
    }

    .form-group:nth-child(1) { animation-delay: 0.1s; }
    .form-group:nth-child(2) { animation-delay: 0.2s; }
    .form-group:nth-child(3) { animation-delay: 0.3s; }
    .form-group:nth-child(4) { animation-delay: 0.4s; }
    .form-group:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">New Account</div>
        </div>
        
        <!-- Login Section -->
        <div class="form-section active" id="login">
            <h1>Company Login</h1>
            <form>
                <div class="form-group">
                    <label for="login-email" class="required">Company Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password" class="required">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <div style="text-align: right; margin-bottom: 15px;">
                    <a href="forgetpassword.html" style="color: var(--secondary); text-decoration: none;">Forgot password?</a>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
        
        <!-- Registration Section -->
        <div class="form-section" id="register">
            <h1>Register New Company</h1>
            <form>
                <h2>Basic Company Information</h2>
                <div class="form-group">
                    <label for="company-name" class="required">Company Name</label>
                    <input type="text" id="company-name" required>
                </div>
                <div class="form-group">
                    <label for="business-type" class="required">Business Type</label>
                    <select id="business-type" required>
                        <option value="">Select Business Type</option>
                        <option value="tech">Information Technology</option>
                        <option value="manufacturing">Manufacturing</option>
                        <option value="retail">Retail</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="education">Education</option>
                        <option value="finance">Financial Services</option>
                        <option value="construction">Construction</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="company-email" class="required">Company Email</label>
                    <input type="email" id="company-email" required>
                </div>
                <div class="form-group">
                    <label for="company-phone" class="required">Company Phone</label>
                    <input type="tel" id="company-phone" required>
                </div>
                <div class="form-group">
                    <label for="company-website">Company Website</label>
                    <input type="url" id="company-website" placeholder="https://">
                </div>
                <div class="form-group">
                    <label for="company-address" class="required">Company Address</label>
                    <textarea id="company-address" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="commercial-reg" class="required">Commercial Registration Number</label>
                    <input type="text" id="commercial-reg" required>
                </div>
                <div class="form-group">
                    <label for="tax-id" class="required">Tax ID</label>
                    <input type="text" id="tax-id" required>
                </div>
                <div class="form-group">
                    <label for="commercial-file" class="required">Commercial Registration Document</label>
                    <input type="file" id="commercial-file" required>
                </div>
                
                <h2>Account Administrator Information</h2>
                <div class="form-group">
                    <label for="admin-name" class="required">Administrator Name</label>
                    <input type="text" id="admin-name" required>
                </div>
                <div class="form-group">
                    <label for="admin-title" class="required">Job Title</label>
                    <input type="text" id="admin-title" required>
                </div>
                <div class="form-group">
                    <label for="admin-email" class="required">Administrator Email</label>
                    <input type="email" id="admin-email" required>
                </div>
                <div class="form-group">
                    <label for="admin-phone" class="required">Administrator Phone</label>
                    <input type="tel" id="admin-phone" required>
                </div>
                
                <h2>Security Information</h2>
                <div class="form-group">
                    <label for="password" class="required">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="required">Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <div class="form-group">
                    <label for="security-question" class="required">Security Question</label>
                    <select id="security-question" required>
                        <option value="">Select Security Question</option>
                        <option value="q1">What is your favorite city?</option>
                        <option value="q2">What is the name of your first pet?</option>
                        <option value="q3">What is the name of the elementary school you attended?</option>
                        <option value="q4">What is the name of the street you grew up on?</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="security-answer" class="required">Security Answer</label>
                    <input type="text" id="security-answer" required>
                </div>
                <div class="form-group">
                    <label for="verification-method" class="required">Two-Factor Authentication Method</label>
                    <select id="verification-method" required>
                        <option value="">Select Verification Method</option>
                        <option value="sms">SMS Text Messages</option>
                        <option value="email">Email</option>
                        <option value="app">Authentication App</option>
                    </select>
                </div>
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>
    <script>
    function switchTab(tabId) {
        // Hide all sections
        const sections = document.getElementsByClassName('form-section');
        for (let i = 0; i < sections.length; i++) {
            sections[i].classList.remove('active');
        }
        
        // Show selected section
        document.getElementById(tabId).classList.add('active');
        
        // Update tabs
        const tabs = document.getElementsByClassName('tab');
        for (let i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove('active');
        }
        
        // Make the clicked tab active
        if (tabId === 'login') {
            tabs[0].classList.add('active');
        } else {
            tabs[1].classList.add('active');
        }
    }
    </script>
</body>
</html>
